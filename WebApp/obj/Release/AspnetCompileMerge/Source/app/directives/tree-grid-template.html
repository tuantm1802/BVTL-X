<div class="table-responsive table-nested table table-striped table-bordered table-hover">
    <table class="table tree-grid">
        <thead>
            <tr ng-repeat="item in colDefinitions">
                <th class="cell-input text-center" style="width:5%;" colspan="{{expandingProperty.colspan}}" rowspan="{{expandingProperty.rowspan}}"  ng-if="showTdCheckbox && $index==0"></th>
                <th class="text-center" colspan="{{expandingProperty.colspan}}" ng-if="$index==0" rowspan="{{expandingProperty.rowspan}}">{{expandingProperty.displayName || expandingProperty.field || expandingProperty}}</th>
                <th class="text-center" ng-repeat="col in item" colspan="{{col.colspan}}" rowspan="{{col.rowspan}}">{{col.displayName || col.field}}</th>
            </tr>
        </thead>
        <tbody>
            
            <tr ng-repeat="row in tree_rows | filter:{visible:true} track by row.branch.uid"  ng-class="'level-' + {{ row.level }} + (row.branch.selected ? ' active' :'')" class="tree-grid-row">
                <td class="cell-input" style="width:5%;"  ng-if="showTdCheckbox">
                    <input  ng-if="row.branch.checkbox" ng-change="ChangeCheckbox(row.branch)" ng-model="row.branch.selected" class="form-control" type="checkbox" />
                </td>
                <td ng-click="row.branch.expanded =!row.branch.expanded" >
                    <a ng-click="user_clicks_branch(row.branch)">
                        <i ng-class="row.tree_icon"
                           class="indented tree-icon"></i>
                    </a><span class="indented tree-label" ng-click="user_clicks_branch(row.branch)">
                        
                        {{row.branch[expandingProperty.field] || row.branch[expandingProperty]}}
                    </span>
                </td>
                <td ng-repeat="col in bodyDefs"  ng-click="ClickChooseRow(row.branch)">{{row.branch[col.field]}}</td>
            </tr>
        </tbody>
    </table>
</div>
