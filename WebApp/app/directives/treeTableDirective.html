<table class="table-nested table table-striped table-bordered table-hover">
    <thead>
        <tr>
            <th class="cell-input" style="width:5%;" ng-if="showCheckbox">
            </th>
            <th class="cell-input" style="width:5%;">
            </th>
            <th ng-repeat="item in listColumnTreetable  track by $index">{{item.columnName}} </th>
        </tr>
    </thead>
    <tbody ng-class="{opened: item.opened}"  ng-repeat="item in treeData  track by $index">
        
    </tbody>
</table>
<script id="table_tree.html" type="text/ng-template">
    <tr ng-class="{parent: item.children}" ng-init="parentScope = $parent.$parent; initCheckbox(item, parentScope.item)">
        <td class="cell-input" style="width:5%;" ng-if="ShowCheckbox">
            <input ng-if="item.checkbox" ng-change="ChangeTreeTableCheckbox(item)" ng-model="item.selected" class="form-control" type="checkbox" />
        </td>
        <td class="cell-name" style="width:5%;" ng-click="item.opened = !item.opened">
            <div class="indent" ng-if="item.parent" style="padding-left: {{15*level}}px"></div>
        </td>
        <td style="{{itemColumn.style}}" ng-click="ClickTreeTableRow(item)" ng-repeat="itemColumn in ListColumnTreetable track by $index">
            <span> {{item[itemColumn.valueName]}} </span>
        </td>
    </tr>
    <tr class="children" ng-if="item.children &amp;&amp; item.children.length &gt; 0">
        <td colspan="4">
            <table class="table table-striped table-bordered table-hover">
                <tbody ng-class="{opened: item.opened}" ng-include="&#39;table_tree.html&#39;" ng-init="level = level + 1" ng-repeat="item in item.children  track by $index"></tbody>
            </table>
        </td>
    </tr>
</script>
